name: Deploy to GitHub Pages

# Builds the static site on every push to main and publishes it to the gh-pages branch.
# One-time setup, after the first run has created the branch:
# repository Settings -> Pages -> Source: "Deploy from a branch", Branch: gh-pages, / (root), Save.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A newer push supersedes an in-flight deploy instead of racing it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build static export
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      # Branch-based Pages runs Jekyll first, which drops every folder starting with "_".
      # Next puts all its CSS and JS in out/_next, so without this file the site loads unstyled.
      - name: Disable Jekyll
        run: touch out/.nojekyll
      # gh-pages holds only generated files, so each deploy replaces it with a single fresh commit.
      - name: Publish to gh-pages
        working-directory: out
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Deploy ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
